<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estimate / Quotation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

  <!-- FORM SCREEN (Exactly matching your UI) -->
  <div id="mainApp" class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md border border-gray-200">
    
    <div class="flex justify-between items-start border-b pb-4 mb-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-700">ESTIMATE / QUOTATION</h1>
        <p class="text-xs text-gray-500">Professional Services & Solutions</p>
      </div>
      <div class="text-right">
        <label class="text-xs text-gray-500 block mb-1">Date:</label>
        <input type="date" id="docDate" class="border rounded px-2 py-1 text-sm bg-white outline-none">
      </div>
    </div>

    <!-- Client Details -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Customer / Client Name:</label>
        <input type="text" id="custName" placeholder="Client Name" class="w-full border rounded px-3 py-1.5 text-sm outline-none focus:border-blue-600">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Contact / Mobile:</label>
        <input type="text" id="custPhone" placeholder="Mobile Number" class="w-full border rounded px-3 py-1.5 text-sm outline-none focus:border-blue-600">
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm mb-4 border">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="p-2 border-r font-semibold">Description</th>
            <th class="p-2 border-r w-24 text-center font-semibold">Qty</th>
            <th class="p-2 border-r w-28 text-right font-semibold">Rate (₹)</th>
            <th class="p-2 border-r w-28 text-right font-semibold">Total (₹)</th>
            <th class="p-2 w-14 text-center font-semibold">Action</th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <tr class="border-b">
            <td class="p-1 border-r"><input type="text" class="w-full px-2 py-1 text-sm outline-none desc" placeholder="Item description"></td>
            <td class="p-1 border-r"><input type="number" value="1" min="1" class="w-full px-2 py-1 text-sm text-center outline-none qty" oninput="calculate()"></td>
            <td class="p-1 border-r"><input type="number" value="0" min="0" class="w-full px-2 py-1 text-sm text-right outline-none rate" oninput="calculate()"></td>
            <td class="p-2 border-r text-right font-medium row-total">0.00</td>
            <td class="p-1 text-center"><button type="button" onclick="removeRow(this)" class="text-red-500 font-bold px-2 hover:text-red-700">✕</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mb-4">
      <button type="button" onclick="addRow()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs px-3 py-1.5 rounded font-medium border border-gray-300">
        + Add Item
      </button>
    </div>

    <!-- Summary -->
    <div class="flex justify-end border-t pt-4">
      <div class="w-64 space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600">Sub Total:</span>
          <span class="font-medium" id="subTotal">₹0.00</span>
        </div>
        <div class="flex justify-between items-center text-xs text-gray-600">
          <label class="cursor-pointer flex items-center gap-1.5">
            <input type="checkbox" id="gstCheck" onchange="calculate()" class="rounded">
            Add GST (18%)
          </label>
          <span id="gstAmount">₹0.00</span>
        </div>
        <div class="flex justify-between text-base font-bold border-t pt-2 text-blue-700">
          <span>Grand Total:</span>
          <span id="grandTotal">₹0.00</span>
        </div>
      </div>
    </div>

    <!-- Hidden Form that bypasses Google Sites iframe sandbox block -->
    <form id="bypassForm" method="GET" target="_blank" class="mt-6 flex justify-end border-t pt-4">
      <input type="hidden" name="print_data" id="printDataInput">
      <button type="button" onclick="submitToPrint()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-medium shadow transition">
        Print / Save as PDF
      </button>
    </form>

  </div>

  <!-- PRINT SHEET VIEW (Shown only in new tab for direct printing) -->
  <div id="printSheet" class="hidden bg-white max-w-3xl mx-auto p-8 border border-gray-300">
    <div class="flex justify-between border-b-2 border-blue-600 pb-4 mb-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-700">ESTIMATE / QUOTATION</h1>
        <p class="text-xs text-gray-500">Professional Services & Solutions</p>
      </div>
      <div class="text-right text-sm">
        <strong>Date:</strong> <span id="pDate"></span>
      </div>
    </div>

    <div class="flex justify-between text-sm mb-6 bg-gray-50 p-3 rounded border border-gray-200">
      <div><strong>Client:</strong> <span id="pName"></span></div>
      <div><strong>Mobile:</strong> <span id="pPhone"></span></div>
    </div>

    <table class="w-full text-left text-sm mb-6 border-collapse border border-gray-300">
      <thead>
        <tr class="bg-gray-100 text-gray-700 uppercase text-xs">
          <th class="p-2 border border-gray-300">Description</th>
          <th class="p-2 border border-gray-300 text-center w-20">Qty</th>
          <th class="p-2 border border-gray-300 text-right w-24">Rate (₹)</th>
          <th class="p-2 border border-gray-300 text-right w-28">Total (₹)</th>
        </tr>
      </thead>
      <tbody id="pItemsBody"></tbody>
    </table>

    <div class="flex justify-end">
      <div class="w-64 space-y-1.5 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600">Sub Total:</span>
          <span class="font-medium" id="pSub"></span>
        </div>
        <div id="pGstRow" class="flex justify-between text-xs text-gray-600">
          <span>GST (18%):</span>
          <span id="pGst"></span>
        </div>
        <div class="flex justify-between font-bold text-base border-t-2 border-blue-600 pt-2 text-blue-700">
          <span>Grand Total:</span>
          <span id="pGrand"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('docDate').valueAsDate = new Date();

    function addRow() {
      const tbody = document.getElementById('itemsBody');
      const tr = document.createElement('tr');
      tr.className = 'border-b';
      tr.innerHTML = `
        <td class="p-1 border-r"><input type="text" class="w-full px-2 py-1 text-sm outline-none desc" placeholder="Item description"></td>
        <td class="p-1 border-r"><input type="number" value="1" min="1" class="w-full px-2 py-1 text-sm text-center outline-none qty" oninput="calculate()"></td>
        <td class="p-1 border-r"><input type="number" value="0" min="0" class="w-full px-2 py-1 text-sm text-right outline-none rate" oninput="calculate()"></td>
        <td class="p-2 border-r text-right font-medium row-total">0.00</td>
        <td class="p-1 text-center"><button type="button" onclick="removeRow(this)" class="text-red-500 font-bold px-2 hover:text-red-700">✕</button></td>
      `;
      tbody.appendChild(tr);
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('#itemsBody tr');
      if (rows.length > 1) {
        btn.closest('tr').remove();
        calculate();
      }
    }

    function calculate() {
      let sub = 0;
      document.querySelectorAll('#itemsBody tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const total = qty * rate;
        row.querySelector('.row-total').textContent = total.toFixed(2);
        sub += total;
      });

      document.getElementById('subTotal').textContent = '₹' + sub.toFixed(2);

      let gst = 0;
      if (document.getElementById('gstCheck').checked) {
        gst = sub * 0.18;
      }
      document.getElementById('gstAmount').textContent = '₹' + gst.toFixed(2);
      document.getElementById('grandTotal').textContent = '₹' + (sub + gst).toFixed(2);
    }

    // Pack data and trigger HTML native Form submit (Bypasses Google Sites iframe sandbox)
    function submitToPrint() {
      const items = [];
      document.querySelectorAll('#itemsBody tr').forEach(row => {
        const desc = row.querySelector('.desc').value.trim();
        const qty = row.querySelector('.qty').value;
        const rate = row.querySelector('.rate').value;
        const total = row.querySelector('.row-total').textContent;
        if (desc !== "" || parseFloat(rate) > 0) {
          items.push({ desc: desc || "-", qty: qty, rate: rate, total: total });
        }
      });

      const data = {
        date: document.getElementById('docDate').value,
        name: document.getElementById('custName').value || 'Customer',
        phone: document.getElementById('custPhone').value || '-',
        sub: document.getElementById('subTotal').textContent,
        isGst: document.getElementById('gstCheck').checked,
        gst: document.getElementById('gstAmount').textContent,
        grand: document.getElementById('grandTotal').textContent,
        items: items
      };

      document.getElementById('printDataInput').value = encodeURIComponent(JSON.stringify(data));
      document.getElementById('bypassForm').submit();
    }

    // Check if opened as printable window
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const rawData = params.get('print_data');

      if (rawData) {
        document.getElementById('mainApp').style.display = 'none';
        const sheet = document.getElementById('printSheet');
        sheet.classList.remove('hidden');

        const parsed = JSON.parse(decodeURIComponent(rawData));
        document.getElementById('pDate').textContent = parsed.date;
        document.getElementById('pName').textContent = parsed.name;
        document.getElementById('pPhone').textContent = parsed.phone;
        document.getElementById('pSub').textContent = parsed.sub;
        document.getElementById('pGrand').textContent = parsed.grand;

        if (parsed.isGst) {
          document.getElementById('pGst').textContent = parsed.gst;
        } else {
          document.getElementById('pGstRow').style.display = 'none';
        }

        const tbody = document.getElementById('pItemsBody');
        tbody.innerHTML = '';
        parsed.items.forEach(it => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-gray-300';
          tr.innerHTML = `
            <td class="p-2 border border-gray-300 font-medium">${it.desc}</td>
            <td class="p-2 border border-gray-300 text-center">${it.qty}</td>
            <td class="p-2 border border-gray-300 text-right">₹${it.rate}</td>
            <td class="p-2 border border-gray-300 text-right font-semibold">₹${it.total}</td>
          `;
          tbody.appendChild(tr);
        });

        setTimeout(() => {
          window.print();
        }, 300);
      }
    });
  </script>
</body>
</html>
